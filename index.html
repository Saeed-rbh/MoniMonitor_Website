<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/monimonitor-logo.png" />
    <link rel="preload" as="image" href="/monimonitor-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18191e" />
    <title>MoniMonitor</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #18191e;
      }

      .MoniLoader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(0, 154, 142, 0.13), transparent 34%),
          #18191e;
      }

      .MoniLoader_Content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 18px;
      }

      .MoniLoader_Logo {
        display: block;
        width: min(64vw, 250px);
        height: auto;
        filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.28));
        animation: moni-loader-breathe 2.1s ease-in-out infinite;
      }

      .MoniLoader_Spinner {
        width: 24px;
        height: 24px;
        border: 3px solid rgba(42, 226, 203, 0.2);
        border-top-color: #2ae2cb;
        border-radius: 50%;
        animation: moni-loader-spin 800ms linear infinite;
      }

      .MoniLoader_SrOnly {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes moni-loader-breathe {
        0%, 100% { opacity: 0.8; transform: translateY(2px) scale(0.985); }
        50% { opacity: 1; transform: translateY(-3px) scale(1); }
      }

      @keyframes moni-loader-spin {
        to { transform: rotate(360deg); }
      }

      @media (prefers-reduced-motion: reduce) {
        .MoniLoader_Logo,
        .MoniLoader_Spinner { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="MoniLoader" role="status" aria-label="Loading MoniMonitor">
        <div class="MoniLoader_Content">
          <img class="MoniLoader_Logo" src="/monimonitor-logo.png" alt="MoniMonitor" />
          <div class="MoniLoader_Spinner" aria-hidden="true"></div>
          <span class="MoniLoader_SrOnly">Loading MoniMonitor</span>
        </div>
      </div>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js?61"></script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
