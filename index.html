<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/monimonitor-logo.png" />
    <link rel="preload" as="image" href="/monimonitor-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18191e" />
    <title>MoniMonitor</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        min-height: 100%;
        margin: 0;
        background: #18191e;
      }

      .MoniLoader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 50% 42%, rgba(0, 154, 142, 0.13), transparent 34%),
          #18191e;
      }

      .MoniLoader_Content {
        display: flex;
        width: min(86vw, 390px);
        flex-direction: column;
        align-items: center;
        gap: 4px;
      }

      .MoniLoader_Logo {
        display: block;
        width: 100%;
        height: auto;
        filter: drop-shadow(0 18px 34px rgba(0, 0, 0, 0.28));
        animation: moni-loader-breathe 2.1s ease-in-out infinite;
      }

      .MoniLoader_Track {
        position: relative;
        width: min(42vw, 164px);
        height: 2px;
        margin-top: -20px;
        overflow: hidden;
        border-radius: 999px;
        background: rgba(255, 245, 240, 0.09);
      }

      .MoniLoader_Track::after {
        position: absolute;
        inset: 0;
        width: 52%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0c948b, #d49d81);
        content: "";
        animation: moni-loader-progress 1.25s ease-in-out infinite;
      }

      .MoniLoader_SrOnly {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }

      @keyframes moni-loader-breathe {
        0%, 100% { opacity: 0.8; transform: translateY(2px) scale(0.985); }
        50% { opacity: 1; transform: translateY(-3px) scale(1); }
      }

      @keyframes moni-loader-progress {
        0% { transform: translateX(-115%); }
        50% { transform: translateX(48%); }
        100% { transform: translateX(215%); }
      }

      @media (prefers-reduced-motion: reduce) {
        .MoniLoader_Logo,
        .MoniLoader_Track::after { animation: none; }
        .MoniLoader_Track::after { width: 100%; opacity: 0.72; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="MoniLoader" role="status" aria-label="Loading MoniMonitor">
        <div class="MoniLoader_Content">
          <img class="MoniLoader_Logo" src="/monimonitor-logo.png" alt="MoniMonitor" />
          <div class="MoniLoader_Track" aria-hidden="true"></div>
          <span class="MoniLoader_SrOnly">Loading MoniMonitor</span>
        </div>
      </div>
    </div>
    <script src="https://telegram.org/js/telegram-web-app.js?61"></script>
    <script type="module" src="/src/index.jsx"></script>
  </body>
</html>
